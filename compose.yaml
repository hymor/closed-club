services:
  postgres:
    image: postgres:17
    container_name: club-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: closed_club
      POSTGRES_USER: club_admin
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}

    ports:
      - "5432:5432"

    volumes:
      - club_pgdata:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club_admin -d closed_club"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  club_pgdata: